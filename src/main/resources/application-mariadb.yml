spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/signal_velocity_sms?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION default_storage_engine=INNODB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
