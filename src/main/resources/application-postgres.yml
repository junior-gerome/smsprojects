spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smsplatform}
    username: ${DB_USERNAME:smsplatform}
    password: ${DB_PASSWORD:smsplatform}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
