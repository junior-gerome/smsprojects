
    <div
      class="fixed inset-0 z-[60] bg-background/60 transition lg:left-72"
      [class.pointer-events-none]="!open()"
      [class.opacity-0]="!open()"
      [class.opacity-100]="open()"
      (click)="close.emit()"
    ></div>

    <aside
      class="fixed right-0 top-0 z-[61] flex h-full w-full max-w-md flex-col border-l border-outline/10 bg-surface-container-lowest/92 p-6 backdrop-blur-2xl transition-transform duration-300"
      [class.translate-x-0]="open()"
      [class.translate-x-full]="!open()"
    >
      <div class="mb-6 flex items-start justify-between">
        <div>
          <p class="eyebrow">{{ i18n.t('notifications.eyebrow') }}</p>
          <h2 class="mt-2 text-2xl font-extrabold text-on-surface">{{ i18n.t('notifications.title') }}</h2>
        </div>
        <button type="button" class="btn-ghost px-2" (click)="close.emit()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="space-y-3 overflow-y-auto pr-1">
        @for (item of items(); track item.id) {
          <article class="rounded-[1.5rem] bg-surface-container-low p-4 ring-1 ring-outline/10">
            <div class="flex items-start gap-3">
              <span class="mt-1 flex h-10 w-10 items-center justify-center rounded-2xl" [ngClass]="toneClass(item.tone)">
                <span class="material-symbols-outlined text-lg">{{ toneIcon(item.tone) }}</span>
              </span>

              <div class="space-y-1">
                <div class="flex items-center gap-3">
                  <h3 class="font-semibold text-on-surface">{{ item.title }}</h3>
                  <span class="text-[0.72rem] font-medium tracking-normal text-on-surface-variant">{{ item.time }}</span>
                </div>
                <p class="text-sm text-on-surface-variant">{{ item.body }}</p>
              </div>
            </div>
          </article>
        }
      </div>
    </aside>
