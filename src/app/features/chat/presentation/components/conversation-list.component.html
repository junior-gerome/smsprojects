
    <section class="section-card">
      <div class="mb-6">
        <p class="eyebrow">{{ i18n.language() === 'fr' ? 'Inbox' : 'Inbox' }}</p>
        <h2 class="mt-2 text-lg font-bold text-on-surface">{{ i18n.language() === 'fr' ? 'Conversations' : 'Conversations' }}</h2>
      </div>

      <div class="space-y-3">
        @for (conversation of conversations(); track conversation.id) {
          <button type="button" [class]="conversationButtonClass(conversation.id)" (click)="select.emit(conversation.id)">
            <div class="flex items-center gap-3">
              <div class="flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-primary to-secondary text-sm font-bold text-white">
                {{ conversation.initials }}
              </div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-3">
                  <h3 class="truncate text-sm font-bold text-on-surface">{{ conversation.name }}</h3>
                  <ui-status-chip [label]="statusLabel(conversation.status)" [tone]="tone(conversation.status)" />
                </div>
                <p class="mt-1 truncate text-sm text-on-surface-variant">{{ conversation.preview }}</p>
                <p class="mt-1 text-xs tracking-[0.06em] text-on-surface-variant">{{ conversation.lastSeen }}</p>
              </div>
            </div>
          </button>
        }
      </div>
    </section>
