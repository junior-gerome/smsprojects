
    <div class="space-y-6">
      <ui-page-header
        [eyebrow]="i18n.t('dashboard.eyebrow')"
        [title]="i18n.t('dashboard.title')"
        [description]="i18n.t('dashboard.description')"
      >
        <div actions>
          <button type="button" class="btn-secondary" (click)="facade.load()">
            <span class="material-symbols-outlined">refresh</span>
            {{ i18n.t('dashboard.refresh') }}
          </button>
          <button type="button" class="btn-primary" routerLink="/campaigns">
            <span class="material-symbols-outlined">rocket_launch</span>
            {{ i18n.t('dashboard.startCampaign') }}
          </button>
        </div>
      </ui-page-header>

      @if (facade.error()) {
        <div class="rounded-[1.75rem] border border-error/20 bg-error/10 px-5 py-4 text-sm text-error">
          {{ facade.error() }}
        </div>
      }

      @if (facade.loading()) {
        <ui-surface-card
          [eyebrow]="i18n.t('dashboard.loadingEyebrow')"
          [title]="i18n.t('dashboard.loadingTitle')"
          [description]="i18n.t('dashboard.loadingDescription')"
        />
      } @else {
        <app-dashboard-stats-grid [stats]="facade.stats()" />
        <app-dashboard-volume-charts [volume]="facade.volume()" [distribution]="facade.distribution()" />

        <div class="grid gap-4 xl:grid-cols-[minmax(0,2fr)_minmax(320px,1fr)]">
          <app-dashboard-activity-feed [activity]="facade.activity()" />

          <ui-surface-card
            [eyebrow]="i18n.t('dashboard.systemHealthEyebrow')"
            [title]="i18n.t('dashboard.systemHealthTitle')"
            [description]="i18n.t('dashboard.systemHealthDescription')"
          >
            <div class="space-y-3">
              <button type="button" class="btn-primary w-full justify-center" routerLink="/campaigns">
                <span class="material-symbols-outlined">rocket_launch</span>
                {{ i18n.t('dashboard.openBuilder') }}
              </button>
              <button type="button" class="btn-secondary w-full justify-center" routerLink="/templates">
                <span class="material-symbols-outlined">description</span>
                {{ i18n.t('dashboard.manageTemplates') }}
              </button>
              <div class="rounded-[1.5rem] bg-secondary/10 p-4 text-sm text-secondary">
                {{ i18n.t('dashboard.healthNote') }}
              </div>
            </div>
          </ui-surface-card>
        </div>
      }
    </div>
