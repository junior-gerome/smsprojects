<section class="section-card">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-on-surface">{{ i18n.t('dashboard.recentActivity') }}</h2>
          <p class="mt-1 text-sm text-on-surface-variant">{{ i18n.t('dashboard.recentActivityDescription') }}</p>
        </div>
        <a class="btn-ghost px-0" routerLink="/analytics">{{ i18n.t('dashboard.viewAll') }}</a>
      </div>

      <div class="space-y-3">
        @for (item of activity(); track item.id) {
          <article class="rounded-[1.5rem] bg-surface-container-low p-4 transition hover:bg-surface-container">
            <div class="flex items-start gap-4">
              <span class="flex h-11 w-11 items-center justify-center rounded-2xl" [ngClass]="iconClass(item.tone)">
                <span class="material-symbols-outlined">{{ item.icon }}</span>
              </span>

              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-3">
                  <h3 class="truncate text-sm font-bold text-on-surface">{{ item.title }}</h3>
                  <span class="text-[0.72rem] font-medium tracking-normal text-on-surface-variant">{{ item.time }}</span>
                </div>
                <p class="mt-1 text-sm leading-6 text-on-surface-variant">{{ item.description }}</p>
              </div>
            </div>
          </article>
        }
      </div>
    </section>
