<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
      @for (stat of stats(); track stat.label) {
        <ui-stat-card
          [label]="stat.label"
          [value]="stat.value"
          [change]="stat.change"
          [trend]="stat.trend"
          [tone]="stat.tone"
          [icon]="stat.icon"
          [helper]="stat.helper"
        />
      }
    </div>
