
    <article class="app-card p-5 transition duration-200 hover:-translate-y-1 hover:bg-surface-container-lowest">
      <div class="mb-4 flex items-start justify-between gap-4">
        <span class="flex h-11 w-11 items-center justify-center rounded-2xl" [ngClass]="iconClass()">
          <span class="material-symbols-outlined text-xl">{{ icon() }}</span>
        </span>

        @if (change()) {
          <span class="inline-flex items-center gap-1 text-[0.78rem] font-semibold tracking-normal" [ngClass]="changeClass()">
            <span class="material-symbols-outlined text-sm">{{ trendIcon() }}</span>
            {{ change() }}
          </span>
        }
      </div>

      <p class="text-[0.8rem] font-medium tracking-normal text-on-surface-variant">{{ label() }}</p>
      <p class="mt-2 text-[2.2rem] font-extrabold leading-none tracking-tight text-on-surface">{{ value() }}</p>

      @if (helper()) {
        <p class="mt-2 text-sm leading-6 text-on-surface-variant">{{ helper() }}</p>
      }
    </article>
