
    <section class="section-card" [class.p-0]="compact()">
      @if (title() || description()) {
        <header class="mb-6" [class.p-6]="compact()">
          @if (eyebrow()) {
            <p class="eyebrow mb-2">{{ eyebrow() }}</p>
          }
          @if (title()) {
            <h2 class="text-lg font-semibold tracking-tight text-on-surface">{{ title() }}</h2>
          }
          @if (description()) {
            <p class="mt-1 text-sm leading-6 text-on-surface-variant">{{ description() }}</p>
          }
        </header>
      }

      <div [class.px-6]="compact()" [class.pb-6]="compact()">
        <ng-content />
      </div>
    </section>
