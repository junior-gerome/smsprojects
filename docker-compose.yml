services:
  postgres:
    image: postgres:16-alpine
    container_name: signal-velocity-postgres
    environment:
      POSTGRES_DB: smsplatform
      POSTGRES_USER: smsplatform
      POSTGRES_PASSWORD: smsplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smsplatform -d smsplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
